<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" width="1200" height="560" role="img" aria-labelledby="t">
<title id="t">readlens — a lens sweeps a web page and flags thin contrast (APCA Lc 66, needs 92.5), small text and line length, while the terminal prints the same findings.</title>
<style>
text{white-space:pre} .m{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,'DejaVu Sans Mono',monospace;font-size:15px;fill:#c9d1d9} .o{fill:#8b949e} .s{font-size:13px}
.serif{font-family:Georgia,'Iowan Old Style','Times New Roman',serif} .sans{font-family:Inter,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif}
</style>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0d1321"/><stop offset="1" stop-color="#1a2238"/></linearGradient>
<radialGradient id="glass" cx=".35" cy=".35" r=".8"><stop offset="0" stop-color="#ffd103" stop-opacity=".28"/><stop offset="1" stop-color="#ffd103" stop-opacity=".08"/></radialGradient>
<filter id="sh" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000" flood-opacity=".45"/></filter>
</defs>
<rect width="1200" height="560" rx="22" fill="url(#bg)"/>

<!-- brand -->
<g transform="translate(48 58)">
  <circle cx="16" cy="-8" r="15" fill="none" stroke="#ffd103" stroke-width="4"/>
  <line x1="27" y1="3" x2="38" y2="14" stroke="#ffd103" stroke-width="5" stroke-linecap="round"/>
  <text x="54" y="4" class="sans" font-size="34" font-weight="800" fill="#f0f6fc">readlens</text>
  <text x="222" y="2" class="sans" font-size="18" fill="#8b949e">see your pages the way readers do</text>
</g>

<!-- page mock -->
<g filter="url(#sh)">
  <rect x="48" y="100" width="540" height="420" rx="14" fill="#eee8dc"/>
  <rect x="48" y="100" width="540" height="40" rx="14" fill="#e0d8c8"/><rect x="48" y="126" width="540" height="14" fill="#e0d8c8"/>
  <circle cx="72" cy="120" r="6" fill="#ff5f57"/><circle cx="92" cy="120" r="6" fill="#febc2e"/><circle cx="112" cy="120" r="6" fill="#28c840"/>
  <rect x="140" y="110" width="300" height="20" rx="10" fill="#f6f1e7"/>
  <text x="156" y="125" class="sans" font-size="13" fill="#6b6457">tokenade.net/fr</text>
</g>
<text x="84" y="196" class="sans" font-size="27" font-weight="800" fill="#1f1b16">Réduisez la facture de tokens</text>
<text x="84" y="226" class="sans" font-size="27" font-weight="800" fill="#1f1b16">de votre agent.</text>
<g class="serif" font-size="16" fill="#6b6457">
  <text x="84" y="262">Une installation, zéro config. Tokenade compacte</text>
  <text x="84" y="284">les sorties de commandes, les résultats MCP et</text>
  <text x="84" y="306">les relectures avant qu'elles ne soient facturées.</text>
</g>
<g class="sans" font-size="12.5" fill="#6b6457">
  <text x="84" y="350">100 % local · Tokenade n'envoie jamais votre code</text>
  <text x="84" y="368">ni vos prompts. Licence MIT OU Apache-2.0.</text>
</g>
<g class="serif" font-size="16" fill="#2b2620">
  <text x="84" y="420">Votre agent lit moins, vous payez moins, et rien</text>
  <text x="84" y="442">de ce qui compte ne disparaît : chaque repli reste</text>
  <text x="84" y="464">récupérable à l'octet près.</text>
</g>

<!-- annotation chips -->
<g opacity="0"><animate attributeName="opacity" dur="14s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.08;0.095;0.3;0.315;1"/><rect x="310" y="236" width="270" height="50" rx="10" fill="#0d1117" stroke="#ff7b72" stroke-width="2"/><text x="324" y="257" class="m" fill="#ff7b72" font-weight="700">APCA Lc 66 &lt; 92.5</text><text x="324" y="275" class="m s" fill="#c9d1d9">WCAG 4.8:1 passes, still thin</text></g>
<g opacity="0"><animate attributeName="opacity" dur="14s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.38;0.395;0.6;0.615;1"/><rect x="310" y="318" width="270" height="50" rx="10" fill="#0d1117" stroke="#ffa657" stroke-width="2"/><text x="324" y="339" class="m" fill="#ffa657" font-weight="700">89% of text &lt; 16px</text><text x="324" y="357" class="m s" fill="#c9d1d9">body 15.5px · captions 12.5px</text></g>
<g opacity="0"><animate attributeName="opacity" dur="14s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.68;0.695;0.92;0.935;1"/><rect x="330" y="372" width="250" height="50" rx="10" fill="#0d1117" stroke="#7ee787" stroke-width="2"/><text x="344" y="393" class="m" fill="#7ee787" font-weight="700">47 chars / line ✓</text><text x="344" y="411" class="m s" fill="#c9d1d9">line height 1.5 · gap 0.58</text></g>

<!-- lens -->
<g transform="translate(150 470)"><animateTransform attributeName="transform" type="translate" dur="14s" repeatCount="indefinite" calcMode="spline" values="150 470;250 268;250 268;210 360;210 360;300 445;300 445;150 470" keyTimes="0;0.06;0.3;0.36;0.6;0.66;0.92;1" keySplines=".4 0 .2 1;.4 0 .2 1;.4 0 .2 1;.4 0 .2 1;.4 0 .2 1;.4 0 .2 1;.4 0 .2 1"/>
  <circle r="46" fill="url(#glass)" stroke="#f0f6fc" stroke-width="5"/>
  <circle r="46" fill="none" stroke="#0d1117" stroke-opacity=".35" stroke-width="1"/>
  <line x1="33" y1="33" x2="66" y2="66" stroke="#f0f6fc" stroke-width="10" stroke-linecap="round"/>
  <line x1="33" y1="33" x2="66" y2="66" stroke="#ffd103" stroke-width="5" stroke-linecap="round"/>
</g>

<!-- terminal -->
<g filter="url(#sh)">
  <rect x="622" y="100" width="530" height="420" rx="14" fill="#0d1117" stroke="#30363d"/>
  <circle cx="646" cy="122" r="6" fill="#30363d"/><circle cx="666" cy="122" r="6" fill="#30363d"/><circle cx="686" cy="122" r="6" fill="#30363d"/>
</g>
<clipPath id="c1"><rect x="646" y="150" height="22" width="0"><animate attributeName="width" dur="14s" repeatCount="indefinite" values="0;0;480;480;0;0" keyTimes="0;0.04;0.100;.95;.965;1"/></rect></clipPath><text x="646" y="166" clip-path="url(#c1)" class="m"><tspan fill="#7ee787">$</tspan> readlens page tokenade.net/fr --only contrast</text>
<g opacity="0"><animate attributeName="opacity" dur="14s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.1;0.115;0.95;0.965;1"/><text x="646" y="192" class="m o"><tspan fill="#ffa657">medium</tspan>  3 text blocks are perceptually thin</text></g>
<g opacity="0"><animate attributeName="opacity" dur="14s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.12;0.135;0.95;0.965;1"/><text x="646" y="214" class="m o">        · ratio 4.8 · apca 66.0 · required 92.5</text></g>
<clipPath id="c2"><rect x="646" y="244" height="22" width="0"><animate attributeName="width" dur="14s" repeatCount="indefinite" values="0;0;480;480;0;0" keyTimes="0;0.34;0.400;.95;.965;1"/></rect></clipPath><text x="646" y="260" clip-path="url(#c2)" class="m"><tspan fill="#7ee787">$</tspan> readlens page tokenade.net/en --only typography</text>
<g opacity="0"><animate attributeName="opacity" dur="14s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.4;0.415;0.95;0.965;1"/><text x="646" y="286" class="m o"><tspan fill="#ff7b72">high</tspan>    Text rendered below 16px     89%</text></g>
<g opacity="0"><animate attributeName="opacity" dur="14s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.42;0.435;0.95;0.965;1"/><text x="646" y="308" class="m o"><tspan fill="#7ee787">100</tspan>     Line length                  47 ch</text></g>
<clipPath id="c3"><rect x="646" y="338" height="22" width="0"><animate attributeName="width" dur="14s" repeatCount="indefinite" values="0;0;480;480;0;0" keyTimes="0;0.64;0.700;.95;.965;1"/></rect></clipPath><text x="646" y="354" clip-path="url(#c3)" class="m"><tspan fill="#7ee787">$</tspan> readlens audit tokenade.net --only clarity</text>
<g opacity="0"><animate attributeName="opacity" dur="14s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.7;0.715;0.95;0.965;1"/><text x="646" y="380" class="m o"><tspan fill="#f0f6fc" font-weight="700">77.6/100 C</tspan>  7 pages · no browser · 3.8s</text></g>
<g opacity="0"><animate attributeName="opacity" dur="14s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.72;0.735;0.95;0.965;1"/><text x="646" y="402" class="m o"><tspan fill="#ff7b72">high</tspan>    Transition words          3/7 pages</text></g>
<clipPath id="c4"><rect x="646" y="432" height="22" width="0"><animate attributeName="width" dur="14s" repeatCount="indefinite" values="0;0;480;480;0;0" keyTimes="0;0.8;0.860;.95;.965;1"/></rect></clipPath><text x="646" y="448" clip-path="url(#c4)" class="m"><tspan fill="#7ee787">$</tspan> readlens page URL --format json | your-agent</text>
<g opacity="0"><animate attributeName="opacity" dur="14s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.86;0.875;0.95;0.965;1"/><text x="646" y="474" class="m o s">{"score": 96.0, "findings": [{"key": "apca_fail", …</text></g>

<text x="600" y="544" text-anchor="middle" class="sans" font-size="15" fill="#8b949e">contrast (WCAG 2.2 + APCA) · typography · line length · clarity · structure · accessibility — measured in a real browser</text>
</svg>
