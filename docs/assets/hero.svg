nt-size="14.5" fill="#8b949e">LIX, Flesch per language, passive, filler, rare words</text><g transform="translate(786 488)" fill="none" stroke="#ffd103" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="4" r="2.2" fill="#ffd103"/><path d="M4 8.5l8 1.5 8-1.5M12 10v5M12 15l-4 7M12 15l4 7"/></g><text x="826" y="500" class="s" font-size="19" font-weight="700" fill="#f0f6fc">Structure &amp; a11y</text><text x="826" y="522" class="s" font-size="14.5" fill="#8b949e">headings, lang, alt text, links, text scaling</text><text x="784" y="560" class="s" font-size="14.5" fill="#8b949e">Claude Code · Codex · Cursor · Copilot</text></svg>
