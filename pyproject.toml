[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "readability-audit"
version = "0.1.0"
description = "Audit the readability, structure and reading comfort of a website. JSON + PDF reports."
readme = "README.md"
license = "MIT OR Apache-2.0"
license-files = ["LICENSE-MIT", "LICENSE-APACHE"]
authors = [{ name = "Paul Irolla" }]
keywords = ["readability", "contrast", "wcag", "apca", "typography", "accessibility", "audit"]
requires-python = ">=3.10"
dependencies = [
  "httpx>=0.27",
  "beautifulsoup4>=4.12",
  "lxml>=5.0",
  "textstat>=0.7.4",
  "trafilatura>=1.12",
  "readability-lxml>=0.8",
  "pyphen>=0.15",
  "selectolax>=0.3",
  "jinja2>=3.1",
  "weasyprint>=60",
  "numpy>=1.26",
  "syllapy>=0.7",
  "wordfreq>=3.0",
  "tomli>=2.0; python_version < '3.11'",
]

[project.urls]
Homepage = "https://github.com/pi-infected/readability"
Issues = "https://github.com/pi-infected/readability/issues"

[project.optional-dependencies]
render = ["playwright>=1.44"]

[project.scripts]
readability = "readability_audit.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
readability_audit = ["templates/*", "data/*"]
[tool.pytest.ini_options]
markers = ["render: needs a headless browser"]
